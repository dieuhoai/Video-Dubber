name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
env:
  PYTHONUTF8: "1"  # console Windows mặc định cp1252 không in được tiếng Việt
  PYTHONIOENCODING: utf-8
  APP: VideoDubber
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: windows }
          - { os: macos-latest, name: macos }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Cài thư viện
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" pyinstaller
      - name: Tải ffmpeg + mô hình AI (đóng kèm vào app)
        run: |
          python scripts/get_ffmpeg.py
          python scripts/get_models.py
      - name: Kiểm tag khớp version
        shell: bash
        run: |
          v=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$v" = "${GITHUB_REF_NAME}" || { echo "Tag ${GITHUB_REF_NAME} ≠ version v$v"; exit 1; }
      - name: Test nhanh trước khi đóng gói
        run: python -m pytest -q -m "not ui"
        env:
          PYTHONIOENCODING: utf-8
      - name: Đóng gói
        run: pyinstaller build/app.spec --noconfirm --workpath build/out --distpath dist
      - name: Smoke test bản đóng gói (Windows)
        if: matrix.name == 'windows'
        run: dist/${{ env.APP }}/${{ env.APP }}.exe cli langs
      - name: Nén (Windows)
        if: matrix.name == 'windows'
        run: Compress-Archive -Path dist/${{ env.APP }}/* -DestinationPath ${{ env.APP }}-windows.zip
      - name: Nén (macOS)
        if: matrix.name == 'macos'
        run: cd dist && ditto -c -k --keepParent ${{ env.APP }}.app ../${{ env.APP }}-macos.zip
      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APP }}-${{ matrix.name }}.zip
          generate_release_notes: true
