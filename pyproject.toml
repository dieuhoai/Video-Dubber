[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "video-dubber"
version = "0.1.3"
description = "Video Dubber — nhân bản video quảng cáo đa ngôn ngữ (caption + voice)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "pydantic>=2.6",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "python-multipart>=0.0.9",  # upload video/nhạc từ trình duyệt
  "fonttools>=4.50",          # đo độ rộng chữ để tự xuống dòng caption
  "numpy>=1.26",
  "soundfile>=0.12",
  "onnxruntime>=1.17",        # chạy mô hình tách nhạc + giọng đọc offline, không cần PyTorch
  "edge-tts>=6.1",            # giọng Microsoft miễn phí (cần mạng)
  "kokoro-onnx>=0.4",         # giọng AI offline
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "playwright>=1.44", "ruff>=0.6"]

[project.scripts]
videodubber = "videodubber.__main__:main"
videodubber-web = "web.server:main"

[tool.setuptools.packages.find]
include = ["videodubber*", "web*"]

[tool.setuptools.package-data]
web = ["static/**/*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: cần tool ngoài / chạy chậm",
  "real: dùng dữ liệu thật qua VIDEODUBBER_REAL_DATA (không bao giờ commit)",
  "ui: test trình duyệt Playwright",
]
